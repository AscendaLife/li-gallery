<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>會動的美甲 · 試戴</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  html,body{margin:0;height:100%;background:#0b0a0a;color:#eee;font:14px/1.5 -apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
  body{overflow:hidden}
  [hidden]{display:none!important}
  #start{position:fixed;inset:0;overflow:auto;z-index:10;background:#0b0a0a;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));text-align:center}
  #start.off{display:none}
  #start h1{font-size:22px;margin:8px 0 4px}
  #start p{margin:0 auto 14px;opacity:.78;font-size:13px;max-width:30em}
  #go{font:inherit;font-size:16px;padding:12px 26px;background:#E3B23C;color:#111;border:0;border-radius:2px;width:100%;max-width:360px;display:block;margin:0 auto 12px}
  #go[disabled]{opacity:.5}
  #qrbox{display:flex;flex-direction:column;align-items:center;gap:6px;margin:10px 0 14px} #qr{background:#fff;padding:6px}
  #msg{font-size:13px;color:#E3B23C;min-height:1.5em;margin:0 auto;max-width:30em}
  #stage{position:fixed;inset:0;z-index:1;background:#000}
  #cam,#fx{position:absolute;inset:0;width:100%;height:100%}
  #cam{object-fit:cover}
  #stage.mirror #cam,#stage.mirror #fx{transform:scaleX(-1)}
  #top{position:fixed;top:0;left:0;right:0;z-index:5;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 18px;background:linear-gradient(rgba(0,0,0,.7),transparent);display:flex;align-items:center;gap:10px}
  #hint{flex:1;font-size:13px}
  #hint b{color:#E3B23C;font-weight:500}
  #flip{font:inherit;font-size:13px;padding:8px 12px;background:rgba(0,0,0,.45);color:#eee;border:1px solid #6b635c;border-radius:2px}
  #bar{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:26px 10px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,0,0,.85));display:flex;flex-direction:column;gap:10px}
  #opts,#sws{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;align-items:center}
  #opts .lbl{flex:0 0 auto;font-size:11px;opacity:.7;margin:0 2px 0 6px}
  .chip{flex:0 0 auto;font:inherit;font-size:13px;padding:6px 12px;background:rgba(0,0,0,.45);color:#eee;border:1px solid #6b635c;border-radius:999px}
  .chip[aria-pressed="true"]{background:#E3B23C;border-color:#E3B23C;color:#111}
  #tune{position:fixed;top:calc(58px + env(safe-area-inset-top,0px));left:10px;right:10px;z-index:6;background:rgba(15,13,12,.92);border:1px solid #3a3531;border-radius:6px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px 12px;align-items:center;font-size:13px}
  #tune input{width:100%} #tune output{font-variant-numeric:tabular-nums;min-width:3.2em;text-align:right;color:#E3B23C}
  #tune p{grid-column:1/-1;margin:0;font-size:12px;opacity:.7}
  .sw{flex:0 0 auto;font:inherit;font-size:12px;color:#eee;background:transparent;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;width:62px}
  .sw i{display:block;width:40px;height:52px;border-radius:50% 50% 46% 46% / 62% 62% 38% 38%;border:2px solid transparent;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
  .sw[aria-pressed="true"] i{border-color:#E3B23C;box-shadow:0 0 0 2px #E3B23C}
  .sw[aria-pressed="true"]{color:#E3B23C}
</style>
</head>
<body>
<div id="start">
  <h1>會動的美甲</h1>
  <p>手上已經做好美甲或戴著穿戴甲？開相機對著手背拍，指甲上的圖案就會動起來。</p>
  <button id="go" type="button">開啟相機</button>
  <p id="msg" role="status"></p>
  <div id="qrbox"><small style="opacity:.7">在電腦上看到這頁？用手機掃這個 QR</small><div id="qr"></div></div>
</div>

<div id="stage" hidden>
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="fx"></canvas>
</div>
<div id="top" hidden>
  <div id="hint">把<b>手背</b>對著鏡頭、五指張開，距離 20–40 公分。</div>
  <button id="tunebtn" type="button" class="chip">微調</button>
  <button id="flip" type="button">切換鏡頭</button>
</div>
<div id="tune" hidden>
  <label for="t-size">大小</label><input id="t-size" type="range" min="60" max="160" step="2"><output id="o-size"></output>
  <label for="t-wide">寬度</label><input id="t-wide" type="range" min="60" max="160" step="2"><output id="o-wide"></output>
  <label for="t-pos">前後</label><input id="t-pos" type="range" min="-30" max="30" step="1"><output id="o-pos"></output>
  <p>調到圖案剛好蓋住指甲，再把這三個數字告訴我，我會設成預設值。</p>
</div>
<div id="bar" hidden><div id="opts"></div><div id="sws"></div></div>

<script type="module">
const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

const DESIGNS = [
  // 真甲特效：不換圖案，直接讓鏡頭裡真正的美甲動起來
  {id:'r1',type:'real',name:'流光',fx:'glint'},
  {id:'r2',type:'real',name:'水波',fx:'wave'},
  {id:'r3',type:'real',name:'極光',fx:'aurora',pal:['#FFB3D9','#B8E1FF','#D4FFD9','#FFF2B3','#E0C2FF']},
  {id:'c1',type:'cat',name:'深海藍',base:['#0B1E44','#050D22'],glow:'#63D2FF'},
  {id:'c2',type:'cat',name:'酒紅',base:['#4A0D20','#1F0510'],glow:'#FF7FA2'},
  {id:'c3',type:'cat',name:'墨綠',base:['#083326','#031510'],glow:'#74FFC6'},
  {id:'c4',type:'cat',name:'香檳金',base:['#4A3416','#1E1408'],glow:'#FFE3A6'},
  {id:'a1',type:'aur',name:'粉極光',base:'#F5D6E5',dark:false,pal:['#FFB3D9','#B8E1FF','#D4FFD9','#FFF2B3','#E0C2FF']},
  {id:'a2',type:'aur',name:'冰藍',base:'#D6EAFF',dark:false,pal:['#9FD8FF','#C9B8FF','#B0FFE8','#FFFFFF','#8FB8FF']},
  {id:'a3',type:'aur',name:'午夜極光',base:'#12122E',dark:true,pal:['#3CFFB4','#4AA8FF','#B46BFF','#FF6BD0','#3CFFB4']},
  {id:'a4',type:'aur',name:'珍珠白',base:'#F4F0E9',dark:false,pal:['#FFDCEB','#D6ECFF','#E2FFD6','#FFF1C4','#E9D6FF']}
];
// 指尖與遠端指節的關鍵點編號：拇指、食指、中指、無名指、小指
const TIPS=[4,8,12,16,20], DIPS=[3,7,11,15,19];
const PIPS=[2,6,10,14,18];
const WIDTH=[0.50,0.42,0.44,0.42,0.38];   // 甲面寬度相對於末節指節長度
const MIDK=[0.70,0.85,0.85,0.85,0.85];    // 用前一節指節補償手指朝鏡頭時的縮短
const NATURAL=0.53, EDGE=0.06;            // 真甲長度、指尖點到甲緣的距離（都以末節指節長度為單位）
const SHAPES=[['round','圓形'],['square','方形'],['almond','杏仁'],['stiletto','尖形'],['coffin','梯形']];
const LENGTHS=[['短',0],['中',0.28],['長',0.6],['特長',1.0]];

const $=id=>document.getElementById(id);
const start=$('start'), msg=$('msg'), go=$('go'), stage=$('stage'), cam=$('cam'), fx=$('fx'), ctx=fx.getContext('2d');
const inApp=/Line\/|FBAN|FBAV|Instagram|MicroMessenger/i.test(navigator.userAgent);

let design = DESIGNS.find(d=>d.id===new URLSearchParams(location.search).get('d')) || DESIGNS[0];
let facing='environment', stream=null, landmarker=null, running=false, lastTime=-1, lastStamp=0, tracks=[], seen=0;
let shape='round', ext=0, tune={size:100,wide:100,pos:0};
try{ const sv=JSON.parse(localStorage.getItem('nailTune')||'null'); if(sv) tune=Object.assign(tune,sv); }catch(e){}

try{ new QRCode($('qr'),{text:location.href,width:150,height:150}); }catch(e){}
if(inApp) msg.textContent='你在 App 內建瀏覽器裡，相機可能打不開。請點右上角「用瀏覽器開啟」，改用 Safari 或 Chrome。';
if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){ go.disabled=true; msg.textContent='這個瀏覽器沒有相機功能，請改用 Safari 或 Chrome，並確認網址是 https。'; }

// ---------- 款式列 ----------
function chip(d){
  if(d.type==='real') return d.fx==='glint'?'linear-gradient(125deg,#8a7f78 0 40%,#fff 50%,#8a7f78 60% 100%)':d.fx==='wave'?'repeating-radial-gradient(circle at 50% 120%,#8a7f78 0 5px,#cfc6bf 5px 9px)':'linear-gradient(135deg,'+d.pal.join(',')+')';
  if(d.type==='cat') return 'linear-gradient(125deg,'+d.base[0]+' 0 38%,'+d.glow+' 50%,'+d.base[1]+' 62% 100%)';
  return 'linear-gradient(135deg,'+d.pal.slice(0,4).join(',')+')'+(d.dark?','+d.base:'');
}
DESIGNS.forEach(d=>{
  const b=document.createElement('button'); b.type='button'; b.className='sw'; b.dataset.id=d.id;
  const i=document.createElement('i'); i.style.background=chip(d); if(d.type==='aur'&&d.dark) i.style.backgroundColor=d.base;
  const s=document.createElement('span'); s.textContent=d.name;
  b.append(i,s); b.addEventListener('click',()=>pick(d)); $('sws').appendChild(b);
});
function pick(d){ design=d; document.querySelectorAll('.sw').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===d.id?'true':'false')); }
pick(design);
function chips(label,items,get,set){
  const l=document.createElement('span'); l.className='lbl'; l.textContent=label; $('opts').appendChild(l);
  const bs=items.map(([v,text])=>{ const b=document.createElement('button'); b.type='button'; b.className='chip'; b.textContent=text;
    b.addEventListener('click',()=>{ set(v); sync(); }); $('opts').appendChild(b); return [b,v]; });
  const sync=()=>bs.forEach(([b,v])=>b.setAttribute('aria-pressed',get()===v?'true':'false')); sync();
}
chips('甲形',SHAPES,()=>shape,v=>{shape=v;});
chips('長度',LENGTHS.map(([t,v])=>[v,t]),()=>ext,v=>{ext=v;});
[['size','%'],['wide','%'],['pos','']].forEach(([k,u])=>{
  const inp=$('t-'+k), out=$('o-'+k); inp.value=tune[k]; out.textContent=tune[k]+u;
  inp.addEventListener('input',()=>{ tune[k]=+inp.value; out.textContent=tune[k]+u; try{ localStorage.setItem('nailTune',JSON.stringify(tune)); }catch(e){} });
});
$('tunebtn').addEventListener('click',()=>{ const t=$('tune'); t.hidden=!t.hidden; $('tunebtn').setAttribute('aria-pressed',t.hidden?'false':'true'); });

// ---------- 畫甲片 ----------
const rgb=h=>{const n=parseInt(h.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255];};
const rgba=(h,a)=>{const c=rgb(h);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';};
function palAt(pal,p,a){
  p=((p%1)+1)%1; const n=pal.length,x=p*n,i=Math.floor(x),f=x-i,c1=rgb(pal[i%n]),c2=rgb(pal[(i+1)%n]);
  return 'rgba('+Math.round(c1[0]+(c2[0]-c1[0])*f)+','+Math.round(c1[1]+(c2[1]-c1[1])*f)+','+Math.round(c1[2]+(c2[2]-c1[2])*f)+','+a+')';
}
function seeded(s){return ()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296;};}
const DOTS=[0,1,2,3,4].map(i=>{const r=seeded(7919*(i+1));return Array.from({length:90},()=>({u:r()-0.5,v:r()-0.5,s:0.6+r()*1.2,ph:r()*6.28}));});

function nailPath(w,h){
  const cu=Math.min(w*0.45,h*0.4), top=-h/2, y1=Math.min(h/2-cu, top+h*0.62), c=w*0.12;
  ctx.beginPath();
  ctx.moveTo(-w/2,h/2-cu);
  ctx.bezierCurveTo(-w/2,h/2+cu*0.3,w/2,h/2+cu*0.3,w/2,h/2-cu);          // 甲根的圓弧
  if(shape==='round'){
    const r=Math.min(w*0.5,h*0.5); ctx.lineTo(w/2,top+r); ctx.ellipse(0,top+r,w/2,r,0,0,Math.PI,true);
  }else if(shape==='square'){
    ctx.lineTo(w/2,top+c); ctx.quadraticCurveTo(w/2,top,w/2-c,top); ctx.lineTo(-w/2+c,top); ctx.quadraticCurveTo(-w/2,top,-w/2,top+c);
  }else if(shape==='stiletto'){
    ctx.lineTo(w/2,y1); ctx.bezierCurveTo(w/2,y1-(y1-top)*0.45,w*0.10,top+(y1-top)*0.12,0,top); ctx.bezierCurveTo(-w*0.10,top+(y1-top)*0.12,-w/2,y1-(y1-top)*0.45,-w/2,y1);
  }else if(shape==='coffin'){
    ctx.lineTo(w/2,y1); ctx.lineTo(w*0.29,top+c); ctx.quadraticCurveTo(w*0.27,top,w*0.20,top); ctx.lineTo(-w*0.20,top); ctx.quadraticCurveTo(-w*0.27,top,-w*0.29,top+c); ctx.lineTo(-w/2,y1);
  }else{ // almond
    ctx.lineTo(w/2,y1); ctx.bezierCurveTo(w/2,y1-(y1-top)*0.6,w*0.24,top,0,top); ctx.bezierCurveTo(-w*0.24,top,-w/2,y1-(y1-top)*0.6,-w/2,y1);
  }
  ctx.closePath();
}
function cat(d,nw,nh,i,t,px){
  const idx=DESIGNS.indexOf(d);
  const g=ctx.createLinearGradient(0,-nh/2,0,nh/2); g.addColorStop(0,d.base[0]); g.addColorStop(1,d.base[1]);
  ctx.fillStyle=g; ctx.fillRect(-nw,-nh,nw*2,nh*2);
  const speed=[0.9,0.6,1.3,0.8][idx%4], bwf=[0.5,0.72,0.36,0.6][idx%4];
  const a=-0.55,nx=Math.cos(a),ny=Math.sin(a), d0=(Math.sin(t*speed+i*0.55)*0.30+px*0.55)*nw*1.4, bw=nw*bwf;
  const lg=ctx.createLinearGradient(nx*(d0-bw),ny*(d0-bw),nx*(d0+bw),ny*(d0+bw));
  lg.addColorStop(0,rgba(d.glow,0)); lg.addColorStop(0.34,rgba(d.glow,0.30)); lg.addColorStop(0.5,'rgba(255,255,255,0.85)'); lg.addColorStop(0.66,rgba(d.glow,0.30)); lg.addColorStop(1,rgba(d.glow,0));
  ctx.globalCompositeOperation='lighter'; ctx.fillStyle=lg; ctx.fillRect(-nw,-nh,nw*2,nh*2);
  const unit=Math.max(1,nw/38); ctx.fillStyle=d.glow;
  for(const p of DOTS[i]){
    const x=p.u*nw,y=p.v*nh,dist=Math.abs(x*nx+y*ny-d0)/(bw*1.5),b=dist<1?(1-dist)*(1-dist):0;
    ctx.globalAlpha=Math.min(1,b*(0.6+0.4*Math.sin(t*3+p.ph))*0.95+0.05);
    const s=p.s*unit; ctx.fillRect(x-s/2,y-s/2,s,s);
  }
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
}
function aur(d,nw,nh,i,t,px){
  const idx=DESIGNS.indexOf(d);
  ctx.fillStyle=d.base; ctx.fillRect(-nw,-nh,nw*2,nh*2);
  const flow=[0.07,0.11,0.09,0.05][idx%4];
  const a=0.7+Math.sin(t*0.25+i*0.9)*(d.dark?0.7:0.45)+px*1.2, dx=Math.cos(a),dy=Math.sin(a),L=nh*0.62, s=t*flow+i*0.13+px*0.4;
  const g=ctx.createLinearGradient(-dx*L,-dy*L,dx*L,dy*L);
  for(let j=0;j<=10;j++){
    const al=d.dark?(0.25+0.75*Math.pow(Math.sin((j/10+s*0.6+i*0.2)*Math.PI*2)*0.5+0.5,1.5)):0.9;
    g.addColorStop(j/10,palAt(d.pal,j/10*1.15+s,al));
  }
  ctx.globalCompositeOperation=d.dark?'screen':'source-over'; ctx.globalAlpha=d.dark?0.95:(idx%4===3?0.55:0.82);
  ctx.fillStyle=g; ctx.fillRect(-nw,-nh,nw*2,nh*2); ctx.globalAlpha=1;
  ctx.globalCompositeOperation=d.dark?'screen':'soft-light';
  for(let k=0;k<2;k++){
    const bx=Math.sin(t*0.5+k*2.1+i)*nw*0.3, by=Math.cos(t*0.37+k*1.3+i*0.7)*nh*0.3, r=nw*0.7;
    const rg=ctx.createRadialGradient(bx,by,0,bx,by,r);
    rg.addColorStop(0,d.dark?palAt(d.pal,s*1.3+k*0.4,0.45):'rgba(255,255,255,0.75)'); rg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=rg; ctx.fillRect(-nw,-nh,nw*2,nh*2);
  }
  const nx=Math.cos(-0.55),ny=Math.sin(-0.55), d0=(Math.sin(t*0.7+i*0.5)*0.34+px*0.6)*nw*1.5, bw=nw*0.5;
  const lg=ctx.createLinearGradient(nx*(d0-bw),ny*(d0-bw),nx*(d0+bw),ny*(d0+bw));
  lg.addColorStop(0,'rgba(255,255,255,0)'); lg.addColorStop(0.5,'rgba(255,255,255,'+(d.dark?0.22:0.5)+')'); lg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.globalCompositeOperation=d.dark?'lighter':'source-over'; ctx.fillStyle=lg; ctx.fillRect(-nw,-nh,nw*2,nh*2);
  ctx.globalCompositeOperation='source-over';
}
function gloss(nw,nh){
  const eg=ctx.createRadialGradient(0,0,nh*0.2,0,0,nh*0.62);
  eg.addColorStop(0,'rgba(0,0,0,0)'); eg.addColorStop(0.7,'rgba(0,0,0,0)'); eg.addColorStop(1,'rgba(20,0,10,0.30)');
  ctx.fillStyle=eg; ctx.fillRect(-nw,-nh,nw*2,nh*2);
  ctx.save(); ctx.globalCompositeOperation='screen'; ctx.translate(-nw*0.22,-nh*0.06); ctx.scale(nw*0.085,nh*0.34);
  const hg=ctx.createRadialGradient(0,0,0,0,0,1); hg.addColorStop(0,'rgba(255,255,255,0.55)'); hg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=hg; ctx.beginPath(); ctx.arc(0,0,1,0,Math.PI*2); ctx.fill(); ctx.restore();
}
const G={sc:1,ox:0,oy:0};
// 真甲特效：把鏡頭裡那片指甲的真實畫面拿來做波動，再疊上流動的光
function real(d,cx,cy,nw,nh,i,t,px){
  if(d.fx!=='glint'){
    ctx.save(); ctx.setTransform(1,0,0,1,0,0);
    const R=Math.hypot(nw,nh)/2+4, x0=cx-R, y0=cy-R, n=28, sh=2*R/n, amp=nw*(d.fx==='wave'?0.075:0.035);
    const vw=cam.videoWidth, vh=cam.videoHeight, sx=(x0-G.ox)/G.sc, sw=2*R/G.sc;
    if(sx>=0&&sx+sw<=vw){
      for(let k=0;k<n;k++){
        const y=y0+k*sh, sy=(y-G.oy)/G.sc, s2=sh/G.sc; if(sy<0||sy+s2>vh) continue;
        ctx.drawImage(cam,sx,sy,sw,s2, x0+Math.sin(k*0.55+t*3.2+i)*amp, y+Math.cos(k*0.4+t*2.3+i)*amp*0.4, 2*R, sh+1);
      }
    }
    ctx.restore();
  }
  if(d.fx==='aurora'){
    const a=0.7+Math.sin(t*0.25+i*0.9)*0.5+px*1.2, dx=Math.cos(a), dy=Math.sin(a), L=nh*0.62, s=t*0.1+i*0.13+px*0.4;
    const g=ctx.createLinearGradient(-dx*L,-dy*L,dx*L,dy*L);
    for(let j=0;j<=10;j++) g.addColorStop(j/10,palAt(d.pal,j/10*1.15+s,1));
    ctx.fillStyle=g; ctx.globalCompositeOperation='overlay'; ctx.globalAlpha=0.75; ctx.fillRect(-nw,-nh,nw*2,nh*2);
    ctx.globalCompositeOperation='screen'; ctx.globalAlpha=0.22; ctx.fillRect(-nw,-nh,nw*2,nh*2); ctx.globalAlpha=1;
  }
  // 掃過甲面的光帶
  const strong=d.fx==='glint', nx=Math.cos(-0.55), ny=Math.sin(-0.55), d0=(Math.sin(t*(strong?1.1:0.7)+i*0.55)*0.32+px*0.55)*nw*1.4, bw=nw*(strong?0.42:0.55);
  const lg=ctx.createLinearGradient(nx*(d0-bw),ny*(d0-bw),nx*(d0+bw),ny*(d0+bw));
  lg.addColorStop(0,'rgba(255,255,255,0)'); lg.addColorStop(0.5,'rgba(255,255,255,'+(strong?0.8:0.3)+')'); lg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.globalCompositeOperation='lighter'; ctx.fillStyle=lg; ctx.fillRect(-nw,-nh,nw*2,nh*2);
  if(strong){
    const unit=Math.max(1,nw/34); ctx.fillStyle='#fff';
    for(const p of DOTS[i]){
      const x=p.u*nw,y=p.v*nh,dist=Math.abs(x*nx+y*ny-d0)/(bw*1.6),b=dist<1?(1-dist)*(1-dist):0;
      ctx.globalAlpha=Math.min(1,b*(0.55+0.45*Math.sin(t*3+p.ph)));
      const sz=p.s*unit; ctx.fillRect(x-sz/2,y-sz/2,sz,sz);
    }
    ctx.globalAlpha=1;
  }
  ctx.globalCompositeOperation='source-over';
}
function drawNail(i,cx,cy,ang,nw,nh,t){
  if(nw<4||nh<4) return;
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(ang);
  nailPath(nw,nh); ctx.clip();
  const px=Math.sin(ang);            // 手一轉，光就跟著跑
  if(design.type==='real') real(design,cx,cy,nw,nh,i,t,px);
  else{ if(design.type==='cat') cat(design,nw,nh,i,t,px); else aur(design,nw,nh,i,t,px); gloss(nw,nh); }
  ctx.restore();
}

// ---------- 相機與手部追蹤 ----------
function fit(){
  const dpr=Math.min(window.devicePixelRatio||1,2), w=Math.round(stage.clientWidth*dpr), h=Math.round(stage.clientHeight*dpr);
  if(w&&h&&(fx.width!==w||fx.height!==h)){ fx.width=w; fx.height=h; }
}
window.addEventListener('resize',fit);

async function openCam(){
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:false});
  cam.srcObject=stream; await cam.play();
  stage.classList.toggle('mirror',facing==='user');
  tracks=[]; lastTime=-1;
}
async function loadModel(){
  const {HandLandmarker,FilesetResolver}=await import(MP+'/vision_bundle.mjs');
  const files=await FilesetResolver.forVisionTasks(MP+'/wasm');
  const opt=dl=>({baseOptions:{modelAssetPath:MODEL,delegate:dl},runningMode:'VIDEO',numHands:2,minHandDetectionConfidence:0.5,minTrackingConfidence:0.5});
  try{ return await HandLandmarker.createFromOptions(files,opt('GPU')); }
  catch(e){ return await HandLandmarker.createFromOptions(files,opt('CPU')); }
}

go.addEventListener('click',async()=>{
  go.disabled=true; msg.textContent='開啟相機中…';
  try{ await openCam(); }                     // iOS 要求相機在按下的當下就請求
  catch(e){ go.disabled=false; msg.textContent='相機打不開：'+(e.name==='NotAllowedError'?'你沒有允許相機權限，請到瀏覽器設定允許後再按一次。':(e.message||e.name)); return; }
  msg.textContent='載入手部追蹤中（第一次約 5–10 秒）…';
  try{ landmarker=await loadModel(); }
  catch(e){ go.disabled=false; msg.textContent='手部追蹤載入失敗，請確認網路後重新整理再試。（'+(e.message||e.name)+'）'; return; }
  start.classList.add('off'); stage.hidden=false; $('top').hidden=false; $('bar').hidden=false;
  fit(); running=true; requestAnimationFrame(loop);
});
$('flip').addEventListener('click',async()=>{
  facing=facing==='environment'?'user':'environment';
  try{ await openCam(); }catch(e){ facing=facing==='environment'?'user':'environment'; try{ await openCam(); }catch(_){} $('hint').textContent='這支手機切換不了鏡頭。'; }
});

// One Euro 濾波：手不動時壓掉抖動，手快速移動時仍跟得上
const MINC=1.2, BETA=25;
const alpha=(dt,c)=>1/(1+(1/(2*Math.PI*c))/dt);
function oe(f,x,dt){
  if(f.x===undefined){ f.x=x; f.dx=0; return x; }
  const raw=(x-f.x)/dt; f.dx+=alpha(dt,1)*(raw-f.dx);
  f.x+=alpha(dt,MINC+BETA*Math.abs(f.dx))*(x-f.x); return f.x;
}
function update(hands,dt){
  const used=new Set(), next=[];
  for(const h of hands){
    let best=null,bd=0.25;
    for(const tr of tracks){ if(used.has(tr)) continue; const d=Math.hypot(tr.pts[0].x-h[0].x,tr.pts[0].y-h[0].y); if(d<bd){bd=d;best=tr;} }
    if(!best) best={f:h.map(()=>[{}, {}]),pts:h.map(p=>({x:p.x,y:p.y})),len:[]};
    used.add(best);
    best.pts=h.map((p,j)=>({x:oe(best.f[j][0],p.x,dt),y:oe(best.f[j][1],p.y,dt)}));
    next.push(best);
  }
  tracks=next;
}
function loop(now){
  if(!running) return;
  requestAnimationFrame(loop);
  if(cam.readyState<2||!cam.videoWidth) return;
  if(cam.currentTime!==lastTime){
    lastTime=cam.currentTime;
    let res=null; try{ res=landmarker.detectForVideo(cam,now); }catch(e){ return; }
    const dt=Math.min(0.2,Math.max(0.005,(now-lastStamp)/1000)); lastStamp=now;
    const hands=res.landmarks||[]; update(hands,dt);
    if(hands.length){ if(++seen===8) $('hint').innerHTML='前三個是讓<b>真的美甲</b>動；先選跟你指甲一樣的甲形和長度，不準就按<b>微調</b>。'; }
  }
  const W=fx.width,H=fx.height,vw=cam.videoWidth,vh=cam.videoHeight, sc=Math.max(W/vw,H/vh), ox=(W-vw*sc)/2, oy=(H-vh*sc)/2, t=now/1000;
  G.sc=sc; G.ox=ox; G.oy=oy;
  const P=p=>[p.x*vw*sc+ox,p.y*vh*sc+oy], ks=tune.size/100, kw=tune.wide/100, kp=tune.pos/100;
  ctx.clearRect(0,0,W,H);
  for(const tr of tracks){
    const h=tr.pts;
    for(let i=0;i<5;i++){
      const [tx,ty]=P(h[TIPS[i]]), [qx,qy]=P(h[DIPS[i]]), [rx,ry]=P(h[PIPS[i]]);
      let ux=tx-qx, uy=ty-qy; const raw=Math.hypot(ux,uy); if(raw<5) continue; ux/=raw; uy/=raw;
      // 指節長度再平滑一次，避免甲片忽大忽小
      const len=tr.len[i]=tr.len[i]?tr.len[i]+(raw-tr.len[i])*0.25:raw;
      const ref=Math.max(len,Math.hypot(qx-rx,qy-ry)*MIDK[i]);
      const nh=(NATURAL+ext)*len*ks, nw=ref*WIDTH[i]*ks*kw;
      const edge=(EDGE+ext+kp)*len;                       // 甲緣在指尖點前方多遠
      drawNail(i, tx+ux*(edge-nh/2), ty+uy*(edge-nh/2), Math.atan2(ux,-uy), nw, nh, t);
    }
  }
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ running=false; } else if(landmarker&&stream&&!running){ running=true; requestAnimationFrame(loop); } });
</script>
